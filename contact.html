html, body { width: 100%; min-height: 100vh; }
body { font-family: 'Kanit', sans-serif; color: #000000; overflow-x: hidden; }

body::before {
    content: ""; position: fixed; inset: 0; z-index: -10;

body::after {

    background: linear-gradient(135deg, rgba(255,255,255,0.50), rgba(64,224,208,0.20), rgba(32,178,170,0.30), rgba(255,255,255,0.40));

}
@keyframes backgroundMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

.decorations { position: fixed; inset: 0; z-index: -5; pointer-events: none; }
.dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; animation: dotFloat 5s ease-in-out infinite; }
.white-dot { background: #FFFFFF; box-shadow: 0 0 8px #FFFFFF, 0 0 15px #FFFFFF; }
.blue-dot { background: #87CEEB; box-shadow: 0 0 8px #87CEEB, 0 0 15px #87CEEB; }
.dot1 { left: 5%; top: 18%; } .dot2 { left: 13%; top: 50%; } .dot3 { left: 25%; top: 30%; } .dot4 { left: 35%; top: 75%; } .dot5 { left: 48%; top: 20%; }
.dot6 { left: 58%; top: 65%; } .dot7 { left: 70%; top: 35%; } .dot8 { left: 80%; top: 78%; } .dot9 { left: 90%; top: 22%; } .dot10 { left: 94%; top: 60%; }
@keyframes dotFloat { 0%,100% { transform: translateY(0); opacity: 0.65; } 50% { transform: translateY(-18px); opacity: 1; } }

.snow { position: fixed; z-index: -4; color: #E0FFFF; font-size: 30px; text-shadow: 0 0 5px #E0FFFF, 0 0 10px #E0FFFF, 0 0 20px #E0FFFF, 0 0 35px #E0FFFF; animation: snowMove 6s ease-in-out infinite; pointer-events: none; }
.snow1 { top: 17%; left: 8%; } .snow2 { top: 30%; left: 88%; animation-delay: 1s; } .snow3 { top: 55%; left: 18%; animation-delay: 2s; } .snow4 { top: 75%; left: 83%; animation-delay: 3s; } .snow5 { top: 87%; left: 45%; animation-delay: 4s; }
@keyframes snowMove { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(25deg); } }

nav {

    display: flex; justify-content: center; align-items: center; gap: 8px; z-index: 1000;
}
.nav-btn {
    position: relative; border: none; background: rgba(255,255,255,0.30); color: #000000;
    font-family: 'Kanit', sans-serif; font-size: 16px; padding: 14px 22px; cursor: pointer;
    border-radius: 18px; transition: 0.3s; backdrop-filter: blur(5px); text-decoration: none; display: inline-block;
}
.nav-btn::before { content: "🐾"; position: absolute; left: -5px; top: -8px; font-size: 22px; transform: rotate(-18deg); filter: drop-shadow(0 0 4px #FFFFFF) drop-shadow(0 0 7px #40E0D0); }
.nav-btn::after { content: "🐾"; position: absolute; right: -5px; bottom: -8px; font-size: 22px; transform: rotate(18deg); filter: drop-shadow(0 0 4px #FFFFFF) drop-shadow(0 0 7px #40E0D0); }
.nav-btn:hover { transform: translateY(-4px) scale(1.05); background: rgba(255,255,255,0.70); box-shadow: 0 0 10px #FFFFFF, 0 0 20px #40E0D0; }
.nav-btn.active { background: rgba(255,255,255,0.80); font-weight: 600; box-shadow: 0 0 10px #FFFFFF, 0 0 18px #40E0D0; }

.page {

.page-title { text-align: center; font-size: clamp(40px, 6vw, 70px); color: #000000; font-weight: 700; margin-bottom: 30px; text-shadow: 0 0 8px #FFFFFF, 0 0 18px #E0FFFF; }

.contact-box { width: 100%; max-width: 700px; margin: auto; display: flex; flex-direction: column; gap: 18px; }
